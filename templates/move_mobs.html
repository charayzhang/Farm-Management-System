{% extends "base.html" %}

{% block title %}FMS - Move Mob{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h1 class="h4 fw-bold text-success mb-1">Move mob</h1>
                <p class="text-muted small mb-0">Each paddock can hold only one mob at a time.</p>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('move_mob') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="mob_id" class="form-label fw-semibold">Select mob</label>
                        <select class="form-select form-select-lg" id="mob_id" name="mob_id" required>
                            {% for mob in mobs %}
                            <option value="{{ mob.id }}">{{ mob.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="new_paddock_id" class="form-label fw-semibold">Move to paddock</label>
                        <select class="form-select form-select-lg" id="new_paddock_id" name="new_paddock_id" required>
                            {% for paddock in paddocks %}
                            <option value="{{ paddock.id }}">{{ paddock.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Confirm move</button>
                        <a href="{{ url_for('paddocks') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
