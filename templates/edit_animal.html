{% extends "base.html" %}

{% block title %}FMS - Edit Animal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h1 class="h4 fw-bold text-success mb-1">Edit animal #{{ animal.id }}</h1>
                <p class="text-muted small mb-0">Update date of birth and weight.</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('update_animal', animal_id=animal.id) }}">
                    <div class="mb-3">
                        <label for="id" class="form-label fw-semibold">Animal ID</label>
                        <input type="text" class="form-control" id="id" name="id" value="{{ animal.id }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="dob" class="form-label fw-semibold">Date of birth</label>
                        <input type="date" class="form-control" id="dob" name="dob" value="{{ animal.dob }}" required>
                    </div>
                    <div class="mb-4">
                        <label for="weight" class="form-label fw-semibold">Weight (kg)</label>
                        <input type="number" step="0.1" min="0" class="form-control" id="weight" name="weight" value="{{ animal.weight }}" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Save changes</button>
                        <a href="{{ url_for('stock') }}" class="btn btn-outline-secondary">Back to stock</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
